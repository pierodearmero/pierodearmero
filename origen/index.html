<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Generado desde build/pagina.html por build/build_page.py: editar allí. -->
<title>Biblioteca ORIGEN</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Lato:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: carril de navegación a la izquierda (arriba en móvil) + mesa de trabajo; la ficha se abre en un panel lateral. */
:root{
  --paper:#F8F6F2; --surface:#FFFFFF; --sunk:#F0ECE5; --ink:#29241E; --muted:#6B6257; --line:#E3DCD1;
  --taupe:#B3A28B; --olive:#6F6B47; --ochre:#9A7B35; --cafe:#544A40; --on-cafe:#F3EDE4;
  --ok:#3F7046; --ok-bg:#E3EEE2; --warn:#8C6216; --warn-bg:#F5EBD6; --crit:#97372D; --crit-bg:#F5E1DD;
  --focus:#6F6B47;
  --display:"Lora", Georgia, "Times New Roman", serif;
  --ui:"Lato", "Helvetica Neue", Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#1B1814; --surface:#24201B; --sunk:#2C2721; --ink:#EEE7DC; --muted:#B3A898; --line:#3B342B;
  --taupe:#C8B79E; --olive:#C2BC8E; --ochre:#D7B76C; --cafe:#3A322A; --on-cafe:#F3EDE4;
  --ok:#8CC394; --ok-bg:#24352A; --warn:#E2B865; --warn-bg:#3A301C; --crit:#E8907F; --crit-bg:#3D2420;
  --focus:#C2BC8E; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#1B1814; --surface:#24201B; --sunk:#2C2721; --ink:#EEE7DC; --muted:#B3A898; --line:#3B342B;
  --taupe:#C8B79E; --olive:#C2BC8E; --ochre:#D7B76C; --cafe:#3A322A; --on-cafe:#F3EDE4;
  --ok:#8CC394; --ok-bg:#24352A; --warn:#E2B865; --warn-bg:#3A301C; --crit:#E8907F; --crit-bg:#3D2420;
  --focus:#C2BC8E; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--cafe)}
h1,h2,h3,h4{font-family:var(--display);font-weight:500;margin:0;text-wrap:balance;line-height:1.2}
p{margin:0} a{color:inherit} button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* estructura */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{background:var(--cafe);color:var(--on-cafe);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:18px;padding-block:22px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px;overflow-y:auto}
.brand{display:flex;gap:12px;align-items:center}
.brand svg{flex:none}
.brand b{font-family:var(--display);font-weight:500;font-size:22px;letter-spacing:.14em}
.brand small{display:block;font-size:10px;letter-spacing:.24em;opacity:.8}
.rail nav{display:flex;flex-direction:column;gap:2px}
.rail nav a{display:flex;justify-content:space-between;gap:8px;text-decoration:none;padding:8px 10px;border-radius:8px;font-size:14px;color:var(--on-cafe);opacity:.86}
.rail nav a:hover{opacity:1;background:rgba(255,255,255,.07)}
.rail nav a[aria-current="page"]{opacity:1;background:rgba(255,255,255,.13);font-weight:700}
.rail nav a span{font-family:var(--mono);font-size:11.5px;opacity:.75}
.sync{margin-top:auto;font-size:12px;line-height:1.4;border-top:1px solid rgba(255,255,255,.18);padding-top:14px;display:grid;gap:6px}
.sync .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#D7B76C;margin-right:6px}
.sync .dot.on{background:#8CC394}
.main{min-width:0;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:28px}
.head{display:grid;gap:8px;max-width:78ch}
.head h1{font-size:clamp(28px,3.6vw,40px)}
.head h2{font-size:clamp(22px,2.6vw,28px)}
section.block{display:grid;gap:14px}
.wrap>*,section.block>*,.card>*,.sheet>*{min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:8px;align-content:start;min-width:0}
.sunk{background:var(--sunk);border-radius:var(--r);padding:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
ul.clean{margin:0;padding-left:18px;display:grid;gap:4px}

/* números del panel */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:2px}
.stat b{font-family:var(--display);font-size:32px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
.stat.warn b{color:var(--warn)} .stat.crit b{color:var(--crit)} .stat.ok b{color:var(--ok)}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--olive);border-radius:99px}
.bar em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}

/* pastillas */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:700;letter-spacing:.04em;white-space:nowrap;border:1px solid transparent}
.pill.PARCIAL{background:var(--warn-bg);color:var(--warn)} .pill.BLOQUEADO{background:var(--crit-bg);color:var(--crit)} .pill.LISTO{background:var(--ok-bg);color:var(--ok)}
.pill.soft{background:var(--sunk);color:var(--muted);font-weight:400}
.pill.line{border-color:var(--line);color:var(--muted);font-weight:400}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:12.5px;background:var(--surface)}
.chip.pend{border-style:dashed}

/* botones */
.btn{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 11px;font-size:13px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.main{background:var(--olive);border-color:var(--olive);color:var(--paper)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.xs{padding:3px 8px;font-size:12px}
.star{border:0;background:none;cursor:pointer;font-size:18px;line-height:1;color:var(--taupe);padding:2px}
.star[aria-pressed="true"]{color:var(--ochre)}

/* formularios */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters input[type=search]{flex:1 1 220px;min-width:0}
input[type=search],input[type=text],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px;max-width:100%}
textarea{width:100%;min-height:70px;resize:vertical}
label.f{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;font-size:14px;border-bottom:2px solid transparent;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--olive);font-weight:700}
.chips-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;min-width:0;max-width:100%}
.chips-scroll button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.chips-scroll button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* tarjetas del banco */
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.idea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-rows:auto 1fr auto;min-width:0;overflow:hidden}
.idea .top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px 0}
.idea .id{font-family:var(--mono);font-size:12.5px;font-weight:500;color:var(--olive)}
.idea .body{padding:6px 12px 10px;display:grid;gap:6px;align-content:start;cursor:pointer}
.idea h3{font-size:17px}
.idea .hook{font-size:13.5px;color:var(--muted)}
.idea .foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:8px 12px;font-size:12px;color:var(--muted)}
.idea.full{border-color:var(--olive);box-shadow:inset 3px 0 0 var(--olive)}
.prio{display:inline-flex;align-items:center;gap:6px}
.prio .bar{width:54px;height:6px}

/* anclas */
.asset{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:grid;min-width:0}
.thumb{aspect-ratio:3/4;max-width:100%;background:var(--sunk);position:relative;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb img[src*="MARCA"]{object-fit:contain;padding:12px;background:var(--taupe)}
.thumb .ph{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:14px;font-size:12.5px;color:var(--muted)}
.thumb.missing .ph{display:grid} .thumb.missing img{display:none}
.thumb .code{position:absolute;left:8px;top:8px;background:var(--surface);color:var(--ink);font-family:var(--mono);font-size:11.5px;padding:2px 7px;border-radius:5px}
.asset .in{padding:12px;display:grid;gap:8px}
.plato{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.plato .mini{width:56px;height:56px;border-radius:8px;background:var(--sunk);border:1px dashed var(--taupe);display:grid;place-items:center;overflow:hidden;font-size:10px;color:var(--muted);text-align:center}
.plato .mini img{width:100%;height:100%;object-fit:cover}

/* referencias */
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.ref{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:grid;grid-template-rows:auto 1fr;min-width:0}
.ref .thumb{aspect-ratio:4/3}
.ref .in{padding:10px;display:grid;gap:6px;align-content:start;font-size:13px}
.ref .st{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.st.verificada,.st.diseño{color:var(--ok)} .st.solo-composición{color:var(--warn)} .st.anti-referencia,.st.posible-IA,.st.descartada{color:var(--crit)}

/* tablas */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--sunk);position:sticky;top:0}
td.n{font-variant-numeric:tabular-nums;text-align:right}

/* panel de ficha */
.drawer{position:fixed;inset:0;z-index:40;display:flex;justify-content:flex-end;background:rgba(20,16,12,.42)}
.drawer .sheet{background:var(--paper);width:min(980px,100%);height:100%;overflow-y:auto;padding-block:max(18px,env(safe-area-inset-top,0px)) 60px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:grid;gap:22px;align-content:start;border-left:1px solid var(--line)}
.sheet .close{position:sticky;top:0;justify-self:end;z-index:2}
.sheet h2{font-size:clamp(24px,3vw,32px)}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted);font-size:12.5px;letter-spacing:.02em}
.kv dd{margin:0;min-width:0}
.slide{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);display:grid;grid-template-columns:200px minmax(0,1fr);overflow:hidden}
.slide .frame{background:var(--cafe);color:var(--on-cafe);aspect-ratio:4/5;padding:14px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.slide .frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.slide .frame .t{position:relative;font-family:var(--display);font-size:16px;line-height:1.2;text-shadow:0 1px 6px rgba(0,0,0,.45)}
.slide .frame .k{position:relative;font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.slide .frame .s{position:relative;font-size:11.5px;opacity:.95}
.slide .info{padding:12px 14px;display:grid;gap:8px;min-width:0}
pre.prompt{font-family:var(--mono);font-size:12px;white-space:pre-wrap;word-break:break-word;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:12px;margin:0;max-height:300px;overflow:auto}
details>summary{cursor:pointer;font-weight:700;font-size:13.5px;padding:4px 0}
.cert{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:var(--sunk);color:var(--muted);margin-right:6px}
.cert.hecho{color:var(--ok);background:var(--ok-bg)} .cert.hipótesis{color:var(--warn);background:var(--warn-bg)} .cert.pendiente{color:var(--crit);background:var(--crit-bg)}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.scores div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;font-size:12.5px;align-items:center}
.scores .bar{grid-column:1/-1;height:6px}
.check li{list-style:none;display:flex;gap:8px}
.check{padding:0;margin:0;display:grid;gap:6px}

/* calendario */
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.week{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:6px;align-content:start;min-height:120px}
.week h4{font-family:var(--ui);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.week a{display:block;font-size:13px;text-decoration:none;border-left:3px solid var(--taupe);padding:3px 8px;background:var(--sunk);border-radius:0 6px 6px 0}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:99px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1}
.notice{border:1px solid var(--line);border-left:4px solid var(--ochre);background:var(--surface);border-radius:var(--r);padding:12px 14px;font-size:14px}
.notice.crit{border-left-color:var(--crit)}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;flex-direction:row;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:auto;overflow-y:hidden}
  .rail nav{flex-direction:row}
  .rail nav a{white-space:nowrap;padding:6px 10px}
  .rail nav a span,.brand small,.sync{display:none}
  .brand b{font-size:17px}
  .slide{grid-template-columns:1fr}
  .slide .frame{max-width:260px}
  .kv{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="Secciones">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="48" fill="none" stroke="currentColor" stroke-width="5"/><path d="M50 50c0-7 7-10 11-6s5 13-2 18-18 3-22-5-1-21 10-26 26 0 30 12" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/></svg>
      <div><b>ORIGEN</b><small>BIBLIOTECA EDITORIAL</small></div>
    </div>
    <nav id="nav"></nav>
    <div class="sync" id="sync" aria-live="polite"></div>
  </aside>
  <main class="main" id="view" tabindex="-1"></main>
</div>
<div class="drawer" id="drawer" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="ficha-title"></div></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="fileAnchor" accept="image/png,image/jpeg,image/webp" hidden>
<input type="file" id="fileImport" accept="application/json,.json" hidden>

<script src="data/origen-data.js"></script>
<script>
(function(){
"use strict";
const D = window.ORIGEN_DATA;
const view = document.getElementById('view');
if(!D){ view.innerHTML = '<div class="wrap"><div class="notice crit">No se encontró <span class="mono">data/origen-data.js</span>. Ábrelo junto a la carpeta <span class="mono">data</span>.</div></div>'; return; }

/* ------------------------------------------------------------ utilidades */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IDEA = Object.fromEntries(D.ideas.map(i => [i.id, i]));
const REF = Object.fromEntries(D.investigacion.referencias.map(r => [r.id, r]));
const ASSET = Object.fromEntries(D.activos.map(a => [a.id, a]));
const BLOQ = Object.fromEntries(D.bloques.map(b => [b.id, b]));
const OBJ = D.objetivos, SEG = D.segmentos.lista;
const ETAPAS = ['Idea','Brief listo','Esperando anclas','En producción','En revisión','Aprobada','Publicada','Descartada'];
const STORE = {
  get(k, d){ try{ const v = localStorage.getItem('origen.v2.' + k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('origen.v2.' + k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};
const S = {
  plan: STORE.get('plan', {}), favs: new Set(STORE.get('favs', [])),
  ui: Object.assign({tab:'C', bloque:'', q:'', obj:'', seg:'', est:'', estado:'', kpi:'', sort:'id', fav:false, refEstado:'utiles', refPlat:'', perfilGrupo:'', planAll:false}, STORE.get('ui', {})),
  mode:'local', db:null, assets:null, downloads:null, canWrite:null, remoteAnch:{}, localAnch:{}, objectUrls:{}, proposal:null, sharedPlanSeen:false
};
const saveUi = () => STORE.set('ui', S.ui);
let toastT;
function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }

/* copiar texto: solo se informa éxito si el portapapeles lo confirma */
const CLIPS = {v:{}, s:{}}; let clipNs = 'v', clipN = 0;
const clip = text => { const k = clipNs + (++clipN); CLIPS[clipNs][k] = text; return k; };
const clipGet = k => (k[0] === 's' ? CLIPS.s : CLIPS.v)[k];
function copyBtn(label, text, cls){ return `<button class="btn ${cls||''}" data-copy="${clip(text)}">${esc(label)}</button>`; }
function copyText(text, btn){
  const done = () => { const o = btn.textContent; btn.textContent = 'Copiado'; btn.classList.add('ok'); setTimeout(() => { btn.textContent = o; btn.classList.remove('ok'); }, 1400); };
  const fallback = () => manualCopy(text);
  try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done, fallback); } else fallback(); }catch(e){ fallback(); }
}
function manualCopy(text){
  openSheet(`<div class="spread"><h2 id="ficha-title">Copia manual</h2><button class="btn close" data-act="close">Cerrar</button></div>
  <p class="muted">Este navegador no permitió escribir en el portapapeles. El texto está seleccionado: usa Ctrl+C o ⌘+C.</p>
  <textarea id="manual" style="min-height:60vh" class="mono">${esc(text)}</textarea>`);

function copyOwnImage(src, btn){
  try{
    if(!(navigator.clipboard && window.ClipboardItem)) throw new Error('sin soporte');
    const png = fetch(src).then(r => { if(!r.ok) throw new Error('no cargó'); return r.blob(); }).then(createImageBitmap).then(bmp => {
      const c = document.createElement('canvas'); c.width = bmp.width; c.height = bmp.height; c.getContext('2d').drawImage(bmp, 0, 0);
      return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('canvas')), 'image/png'));
    });
    navigator.clipboard.write([new ClipboardItem({'image/png': png})]).then(() => { const o = btn.textContent; btn.textContent = 'Imagen copiada'; btn.classList.add('ok'); setTimeout(() => { btn.textContent = o; btn.classList.remove('ok'); }, 1500); },
      () => toast('El navegador no permitió copiar la imagen. Usa «Descargar».'));
  }catch(e){ toast('Este navegador no permite copiar imágenes. Usa «Descargar».'); }
}
async function offerFile(name, data, mime){
  if(S.downloads){
    try{ await S.downloads.save({filename:name, data}); toast('Archivo entregado: ' + name); return; }
    catch(e){ if(e && e.code === 'declined'){ toast('Descarga cancelada'); return; } }
  }
  try{
    const b = data instanceof Blob ? data : new Blob([data], {type:mime || 'text/plain'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);

  }catch(e){ if(typeof data === 'string') manualCopy(data); else toast('No se pudo descargar en esta vista.'); }
}

/* ------------------------------------------------------------ almacenamiento de anclas locales (IndexedDB) */
const IDB = {
  db:null,
  open(){ if(this.db) return Promise.resolve(this.db); return new Promise((res, rej) => { try{ const r = indexedDB.open('origen-anclas', 1); r.onupgradeneeded = () => r.result.createObjectStore('a'); r.onsuccess = () => res(this.db = r.result); r.onerror = () => rej(r.error); }catch(e){ rej(e); } }); },
  async tx(mode, fn){ const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('a', mode); const s = t.objectStore('a'); const r = fn(s); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); }); },
  put(k, v){ return this.tx('readwrite', s => s.put(v, k)); },
  del(k){ return this.tx('readwrite', s => s.delete(k)); },
  async all(){ const db = await this.open(); return new Promise((res, rej) => { const out = {}; const t = db.transaction('a', 'readonly'); const c = t.objectStore('a').openCursor(); c.onsuccess = () => { const cur = c.result; if(cur){ out[cur.key] = cur.value; cur.continue(); } else res(out); }; c.onerror = () => rej(c.error); }); }
};
async function loadLocalAnchors(){
  try{ const all = await IDB.all(); for(const k in all){ const v = all[k]; if(v && v.blob){ S.localAnch[k] = Object.assign({}, v, {url: URL.createObjectURL(v.blob)}); } } }catch(e){ /* sin IndexedDB: se ignora */ }
}
function anchorSrc(id){
  if(S.remoteAnch[id] && S.remoteAnch[id].asset) return {src:'/_blob/' + S.remoteAnch[id].asset, where:'compartida', meta:S.remoteAnch[id]};
  if(S.localAnch[id]) return {src:S.localAnch[id].url, where:'local', meta:S.localAnch[id]};
  const a = ASSET[id]; if(a && a.archivo) return {src:a.archivo, where:'archivo', meta:a};
  return null;
}

async function initCaps(){
  if(!(window.claude && typeof window.claude.use === 'function')) return;
  const use = n => window.claude.use(n).catch(() => null);
  const [db, user, assets, downloads] = await Promise.all([use('db'), use('user'), use('assets'), use('downloads')]);
  S.assets = assets; S.downloads = downloads;
  if(user){ try{ S.canWrite = await user.can('data.write'); }catch(e){} }
  if(db){
    S.db = db; S.mode = 'compartido';
    db.collection('plan').onSnapshot(snap => {
      const remote = {}; snap.docs.forEach(d => { if(d.exists) remote[d.id] = d.data(); });
      S.sharedCount = snap.size; S.sharedPlanSeen = true;
      S.localOnly = Object.keys(S.plan).filter(k => !remote[k]);

    && (!q || [i.id, i.titulo, i.gancho, i.nota, i.platos_nombres.join(' '), i.estructura_label, BLOQ[i.bloque].nombre, etapaOf(i.id), planOf(i.id).responsable || ''].join(' ').toLowerCase().includes(q)));

}

function mondayOf(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const wd = (x.getDay() + 6) % 7; x.setDate(x.getDate() - wd); return x; }
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const fmtDate = d => d.toLocaleDateString('es-PE', {day:'numeric', month:'short'});
function propose(){
  const free = D.ideas.filter(i => i.estado !== 'BLOQUEADO' && !planOf(i.id).fecha && etapaOf(i.id) !== 'Descartada').sort((a, b) => b.prioridad - a.prioridad || a.id.localeCompare(b.id));
  const C = free.filter(i => i.id[0] === 'C'), Pp = free.filter(i => i.id[0] === 'P');
  const start = mondayOf(new Date()); const out = []; const used = new Set();
  const pick = (pool, w) => { const objs = new Set(out.filter(x => x.w === w).map(x => IDEA[x.id].obj1)); let c = pool.find(i => !used.has(i.id) && !objs.has(i.obj1)) || pool.find(i => !used.has(i.id)); if(c) used.add(c.id); return c; };
  for(let w = 0; w < 8; w++){
    [[C, 1], [Pp, 2], [C, 3], [Pp, 5]].forEach(([pool, off]) => { const c = pick(pool, w); if(c){ const d = new Date(start); d.setDate(d.getDate() + 7 * w + off); out.push({id:c.id, fecha:iso(d), w}); } });
  }
  return out;
}

}
function fichaHtml(i){
  const b = BLOQ[i.bloque]; const F = D.fichas[i.id];
  const head = `<div class="spread"><span class="eyebrow">${i.id} · Bloque ${b.id} · ${esc(b.nombre)}</span><button class="btn close" data-act="close">Cerrar</button></div>
    <header class="head"><h2 id="ficha-title">${esc(i.titulo)}</h2><div class="row">${pill(i.estado)}<span class="pill line">${esc(i.formato)} · ${esc(i.estructura_label)}</span><span class="pill line">${F ? esc(F.version) : 'Matriz v1 · 2026-10-26'}</span>
      <button class="star" aria-pressed="${S.favs.has(i.id)}" data-fav="${i.id}" aria-label="Favorito">★</button>${copyBtn('Copiar ancla #' + i.id, '#' + i.id, 'xs')}</div></header>`;
  if(F) return head + fullFicha(i, F);
  const legacy = i.legado.length ? `<p class="small"><b>Solapa con legado:</b> ${i.legado.join(', ')}</p>` : '';
  return head + `
  <div class="notice">Ficha de matriz. El guion slide por slide, los textos finales y los prompts por toma se desarrollan al pedir <b>«DESARROLLA ${i.id}»</b>.</div>
  <section class="card"><span class="eyebrow">Concepto y gancho</span><p style="font-family:var(--display);font-size:19px">${esc(i.gancho)}</p>${i.nota ? `<p class="small"><b>Nota:</b> ${esc(i.nota)}</p>` : ''}${legacy}</section>
  <dl class="kv">
    <dt>Objetivo principal</dt><dd>${esc(objName(i.obj1))} <span class="muted small">— ${esc(OBJ[i.obj1].porque)}</span></dd>
    ${i.obj2 ? `<dt>Objetivo secundario</dt><dd>${esc(objName(i.obj2))}</dd>` : ''}
    <dt>KPI principal</dt><dd>${esc(i.kpi_label)}</dd>
    <dt>Segmento (hipótesis)</dt><dd>${esc(segNames(i.segmentos))}</dd>
    <dt>Formato</dt><dd>${esc(i.estructura_label)}${i.formato === 'Carrusel' ? ' · 5–7 slides' : ' · una composición'} · 4:5 · 1080×1350</dd>
    <dt>Platos de carta</dt><dd>${i.platos_nombres.length ? i.platos_nombres.map(p => `<span class="chip pend">${esc(p)}</span>`).join(' ') : '<span class="muted">Sin plato: pieza de espacio, servicio o diseño</span>'}</dd>
    <dt>Esfuerzo</dt><dd>${i.esfuerzo}/5 · requiere ${i.requiere.length ? esc(i.requiere.join(', ')) : 'solo anclas de espacio'}</dd>
    <dt>Mezcla</dt><dd>${i.mezcla.map(m => ({H:'Ambiente/personas', U:'Utilidad', K:'Conversación', V:'Conversión'})[m]).join(' · ')}</dd>
  </dl>
  <section class="block"><h3>Anclas requeridas</h3><div class="tbl"><table><thead><tr><th>Tipo</th><th>Código</th><th>Estado</th></tr></thead><tbody>${i.anclas.map(a => `<tr><td>${esc(a.tipo)}</td><td class="mono">${esc(a.id)}${a.plato ? ' · ' + esc(a.plato) : ''}</td><td>${esc(a.detalle ? a.detalle + ' — ' : '')}${esc(a.estado)}</td></tr>`).join('')}</tbody></table></div></section>
  ${attachPanel(i)}
  <section class="block"><h3>Inspiración verificada (no literal)</h3>${refsHtml(i.refs.map(r => [r, '']))}</section>
  <section class="block"><div class="spread"><h3>Prompt base de la toma principal</h3><div class="row">${copyBtn('Copiar prompt', i.prompt_base, 'main')}${copyBtn('Copiar texto', i.titulo, '')}</div></div><pre class="prompt">${esc(i.prompt_base)}</pre></section>
  <section class="block"><h3>Prioridad explicada</h3>${scoresHtml(i)}</section>
  ${planEditor(i.id)}
  <section class="card"><h3>Control de calidad antes de aprobar</h3><ul class="check small">${D.reglas.checklist.map(q => `<li><span aria-hidden="true">☐</span>${esc(q)}</li>`).join('')}</ul></section>`;
}
function fullFicha(i, F){
  const allPrompts = F.slides.map(s => s.prompt).join('\n\n' + '='.repeat(60) + '\n\n');
  const allTexts = F.slides.map(s => `Slide ${s.n}\n${[s.texto.titular, s.texto.subtitulo, s.texto.micro].filter(Boolean).join('\n')}`).join('\n\n');
  const locSrc = (anchorSrc('LOC-01') || {}).src;
  const pv = F.plan_visual, pr = F.proposito, prod = F.produccion, med = F.medicion;
  return `
  <div class="notice"><b>Estado: ${esc(F.estado)}.</b> ${esc(F.estado_detalle)}</div>
  <section class="card"><span class="eyebrow">Concepto y gancho</span><p style="font-family:var(--display);font-size:20px">${esc(F.gancho)}</p><p class="small"><b>Diferencia creativa:</b> ${esc(F.diferencia)}</p></section>
  <section class="block"><h3>Hallazgo</h3><ul class="clean">${F.insight.map(([c, t]) => `<li><span class="cert ${esc(c)}">${esc(c)}</span>${esc(t)}</li>`).join('')}</ul></section>
  <dl class="kv">
    <dt>Problema</dt><dd>${esc(pr.problema)}</dd><dt>Objetivos</dt><dd>${esc(objName(pr.obj1))} · ${esc(objName(pr.obj2))}</dd><dt>Etapa</dt><dd>${esc(pr.etapa)}</dd>
    <dt>KPI principal</dt><dd>${esc(pr.kpi)} — ${esc(pr.kpi_motivo)}</dd><dt>KPI secundarios</dt><dd>${esc(pr.kpis2.join(' · '))}</dd>
    <dt>Segmento</dt><dd>${esc(F.segmento)}</dd><dt>Ocasión</dt><dd>${esc(F.ocasion)}</dd>
    <dt>Platos exactos</dt><dd>${F.platos_detalle.map(p => `<div><b>${esc(p.nombre)}</b> <span class="mono muted">${esc(p.ancla)} · PENDIENTE</span><div class="small muted">${esc(p.carta)}</div></div>`).join('')}</dd>
    <dt>Espacios</dt><dd>${F.espacios.map(e => `<span class="chip">${esc(e)} · provisional</span>`).join(' ')}</dd>
    <dt>Datos pendientes</dt><dd><ul class="clean small">${F.pendientes.map(p => `<li>${esc(p)}</li>`).join('')}</ul></dd>
  </dl>
  ${attachPanel(i, F.platos)}
  <section class="block"><h3>Inspiración verificada</h3>${refsHtml(F.refs.filter(r => r.id).map(r => [r.id, r.uso]))}</section>
  <section class="block"><h3>Plan visual</h3><dl class="kv"><dt>Proporción</dt><dd>${esc(pv.proporcion)}</dd><dt>Composición</dt><dd>${esc(pv.composicion)}</dd><dt>Luz</dt><dd>${esc(pv.luz)}</dd><dt>Continuidad</dt><dd>${esc(pv.continuidad)}</dd><dt>Textura</dt><dd>${esc(pv.textura)}</dd><dt>Manos</dt><dd>${esc(pv.manos)}</dd><dt>Cámara</dt><dd>${esc(pv.camara)}</dd></dl></section>
  <section class="block"><div class="spread"><h3>Guion · ${F.slides.length} slides</h3><div class="row">${copyBtn('Copiar todos los prompts', allPrompts, 'main')}${copyBtn('Copiar todos los textos', allTexts, '')}</div></div>
    ${F.slides.map(s => `<article class="slide"><div class="frame">${locSrc ? `<img src="${esc(locSrc)}" alt="" data-hide-err>` : ''}<span class="k">${String(s.n).padStart(2, '0')} · ${esc(s.loc)}</span><span class="t">${esc(s.texto.titular)}</span><span class="s">${esc(s.texto.subtitulo)}</span></div>
      <div class="info"><b>${esc(s.nombre)}</b><span class="small"><b>Propósito:</b> ${esc(s.proposito)} · <b>Transición:</b> ${esc(s.transicion)}</span>
        <span class="small"><b>Texto en arte:</b> ${esc([s.texto.titular, s.texto.subtitulo, s.texto.micro].filter(Boolean).join(' / '))}</span>
        <span class="mono muted">${esc(s.ficha_minima)}</span>
        <details><summary>Prompt completo de la toma</summary><pre class="prompt">${esc(s.prompt)}</pre></details>
        <div class="row">${copyBtn('Copiar prompt de esta toma', s.prompt, 'main xs')}${copyBtn('Copiar texto', [s.texto.titular, s.texto.subtitulo, s.texto.micro].filter(Boolean).join('\n'), 'xs')}</div></div></article>`).join('')}
    <p class="small muted">La vista previa usa LOC-01 de fondo solo para ubicar el texto; no representa la toma final.</p></section>
  <section class="card"><div class="spread"><h3>Caption</h3>${copyBtn('Copiar caption', F.caption, 'main')}</div><p style="white-space:pre-line;font-family:var(--display)">${esc(F.caption)}</p><p class="small"><b>CTA:</b> ${esc(F.cta)}</p></section>
  <section class="block"><h3>Producción</h3><dl class="kv"><dt>Método</dt><dd>${esc(prod.metodo)}</dd><dt>Lista de tomas</dt><dd><ol class="small" style="margin:0;padding-left:18px">${prod.tomas.map(t => `<li>${esc(t)}</li>`).join('')}</ol></dd><dt>Horario</dt><dd>${esc(prod.horario)}</dd><dt>Dificultad</dt><dd>${prod.dificultad}/5</dd><dt>Dependencias</dt><dd>${esc(prod.dependencias.join(' · '))}</dd><dt>Permisos</dt><dd>${esc(prod.permisos.join(' · '))}</dd></dl></section>
  <section class="block"><h3>Medición</h3><dl class="kv"><dt>KPI</dt><dd>${esc(med.kpi)}</dd><dt>Secundarios</dt><dd>${esc(med.secundarios.join(' · '))}</dd><dt>Hipótesis</dt><dd>${esc(med.hipotesis)}</dd><dt>Comparación</dt><dd>${esc(med.comparacion)}</dd></dl></section>
  <section class="block"><h3>Prioridad explicada</h3>${scoresHtml(i)}</section>
  ${planEditor(i.id)}
  <section class="card"><h3>Control de calidad</h3><ul class="check small">${F.checklist.map(c => `<li><span class="cert ${c.estado === 'ok' ? 'hecho' : c.estado === 'pendiente' ? 'pendiente' : 'hipótesis'}">${esc(c.estado)}</span>${esc(c.pregunta)}</li>`).join('')}</ul></section>`;
}
function fichaMd(id){
  const i = IDEA[id], F = D.fichas[id];
  return `# ${id} · ${i.titulo}\n\nEstado: ${F.estado} — ${F.estado_detalle}\nVersión: ${F.version}\n\n## Gancho\n${F.gancho}\n\n## Diferencia\n${F.diferencia}\n\n## Hallazgo\n${F.insight.map(([c, t]) => `- [${c}] ${t}`).join('\n')}\n\n## Propósito\n- Problema: ${F.proposito.problema}\n- Objetivos: ${objName(F.proposito.obj1)} / ${objName(F.proposito.obj2)}\n- KPI: ${F.proposito.kpi} — ${F.proposito.kpi_motivo}\n\n## Segmento y ocasión\n${F.segmento}\n${F.ocasion}\n\n## Platos\n${F.platos_detalle.map(p => `- ${p.nombre} (${p.ancla}, PENDIENTE): ${p.carta}`).join('\n')}\n\n## Pendientes\n${F.pendientes.map(p => '- ' + p).join('\n')}\n\n## Guion\n${F.slides.map(s => `### S${String(s.n).padStart(2, '0')} · ${s.nombre}\n- Propósito: ${s.proposito}\n- Texto: ${[s.texto.titular, s.texto.subtitulo, s.texto.micro].filter(Boolean).join(' / ')}\n- Ficha mínima: ${s.ficha_minima}\n\n\`\`\`\n${s.prompt}\n\`\`\``).join('\n\n')}\n\n## Caption\n${F.caption}\n\nCTA: ${F.cta}\n\n## Producción\n${F.produccion.metodo}\n${F.produccion.tomas.map(t => '- ' + t).join('\n')}\n\n## Medición\n${F.medicion.kpi} · ${F.medicion.hipotesis}\n`;
}

/* ------------------------------------------------------------ exportaciones */
function exportar(kind){
  const today = iso(new Date());
  if(kind === 'csv'){
    const rows = [['ID', 'Bloque', 'Formato', 'Título', 'Estructura', 'Objetivo 1', 'Objetivo 2', 'Segmentos', 'Platos', 'Anclas', 'KPI', 'Esfuerzo', 'Prioridad', 'Estado', 'Etapa', 'Responsable', 'Fecha', 'Gancho', 'Nota']];
    D.ideas.forEach(i => { const p = planOf(i.id); rows.push([i.id, i.bloque, i.formato, i.titulo, i.estructura_label, objName(i.obj1), objName(i.obj2), segNames(i.segmentos), i.platos_nombres.join('; '), i.anclas.map(a => a.id).join('; '), i.kpi_label, i.esfuerzo, i.prioridad, i.estado, etapaOf(i.id), p.responsable || '', p.fecha || '', i.gancho, i.nota]); });
    return offerFile(`origen-banco-240-${today}.csv`, toCsv(rows), 'text/csv');
  }
  if(kind === 'json') return offerFile(`origen-base-${today}.json`, JSON.stringify(D, null, 1), 'application/json');
  if(kind === 'refs'){
    const rows = [['REF', 'Marca', 'Plataforma', 'URL', 'Imagen', 'Autor', 'Revisado', 'Estado', 'Luz', 'Descripción', 'Principio', 'Evitar']];
    D.investigacion.referencias.forEach(r => rows.push([r.id, r.marca, r.plataforma, r.url, r.imagen, r.autor, r.revisado, r.estado, r.luz, r.visual, r.principio, r.evitar]));
    return offerFile(`origen-referencias-${today}.csv`, toCsv(rows), 'text/csv');
  }
  const sep = '\n\n' + '='.repeat(80) + '\n\n';
  const full = Object.values(D.fichas).flatMap(F => F.slides.map(s => s.prompt));
  if(kind === 'promptsfull') return offerFile(`origen-prompts-C001-C002-${today}.txt`, full.join(sep), 'text/plain');
  if(kind === 'prompts') return offerFile(`origen-prompts-todos-${today}.txt`, full.concat(D.ideas.filter(i => !i.ficha).map(i => i.prompt_base)).join(sep), 'text/plain');
  if(kind === 'md') return offerFile(`origen-fichas-C001-C002-${today}.md`, Object.keys(D.fichas).map(fichaMd).join('\n\n---\n\n'), 'text/markdown');
  if(kind === 'backup') return offerFile(`origen-respaldo-plan-${today}.json`, JSON.stringify({tipo:'origen-respaldo', version:1, exportado:new Date().toISOString(), plan:S.plan, favoritos:[...S.favs]}, null, 1), 'application/json');
}
async function importar(file){
  try{
    const j = JSON.parse(await file.text());
    if(j.tipo !== 'origen-respaldo' || typeof j.plan !== 'object') throw new Error('formato');
    let n = 0; for(const id in j.plan){ if(IDEA[id]){ savePlan(id, j.plan[id]); n++; } }
    (j.favoritos || []).forEach(f => IDEA[f] && S.favs.add(f)); STORE.set('favs', [...S.favs]);
    toast(`Respaldo importado: ${n} entradas${S.mode === 'compartido' && S.canWrite !== false ? ' (también en el plan compartido)' : ''}`); rerender();
  }catch(e){ toast('El archivo no es un respaldo de ORIGEN válido.'); }
}

/* ------------------------------------------------------------ adjuntar anclas */
let attachTarget = null;
async function attachFile(id, file){
  if(!/^image\/(png|jpeg|webp)$/.test(file.type)){ toast('Usa una foto JPG, PNG o WebP.'); return; }
  if(S.assets && S.db){
    try{
      const res = await S.assets.upload(file);
      await S.db.doc('anclas/' + id).set({asset:res.id, nombre:file.name, subido:new Date().toISOString(), tipo:id.split('-')[0]});
      toast(id + ' adjuntada y compartida con el equipo'); return;
    }catch(e){ toast('No se pudo subir al artefacto (' + (e && e.code || 'error') + '); se guarda en este navegador.'); }
  }
  try{
    await IDB.put(id, {blob:file, nombre:file.name, subido:new Date().toISOString()});
    if(S.localAnch[id]) URL.revokeObjectURL(S.localAnch[id].url);
    S.localAnch[id] = {blob:file, nombre:file.name, url:URL.createObjectURL(file)};
    toast(id + ' adjuntada en este navegador'); rerender();
  }catch(e){ toast('Este navegador no permite guardar archivos locales.'); }
}

/* ------------------------------------------------------------ eventos */
document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-open],a'); if(!t) return;
  if(t.dataset.copy){ const tx = clipGet(t.dataset.copy); if(tx === undefined){ toast('Vuelve a intentarlo: la vista se actualizó.'); return; } copyText(tx, t); return; }
  if(t.dataset.copyimg){ copyOwnImage(t.dataset.copyimg, t); return; }
  if(t.dataset.dlAsset){ const s = anchorSrc(t.dataset.dlAsset); if(s) fetch(s.src).then(r => r.blob()).then(b => offerFile(t.dataset.dlAsset + '.jpg', b, 'image/jpeg')).catch(() => toast('No se pudo leer el archivo en esta vista.')); return; }
  if(t.dataset.attach){ attachTarget = t.dataset.attach; document.getElementById('fileAnchor').click(); return; }
  if(t.dataset.fav){ const id = t.dataset.fav; S.favs.has(id) ? S.favs.delete(id) : S.favs.add(id); STORE.set('favs', [...S.favs]); rerender(); return; }
  if(t.dataset.open){ location.hash = t.dataset.open; return; }
  if(t.dataset.exp){ exportar(t.dataset.exp); return; }
  if(t.dataset.set !== undefined && t.tagName === 'BUTTON'){ S.ui[t.dataset.set] = t.dataset.val; if(t.dataset.set === 'tab') S.ui.bloque = ''; saveUi(); rerender(); return; }
  if(t.dataset.toggle){ S.ui[t.dataset.toggle] = !S.ui[t.dataset.toggle]; saveUi(); rerender(); return; }
  const act = t.dataset.act;
  if(act === 'close'){ closeSheet(); return; }
  if(act === 'clear'){ Object.assign(S.ui, {bloque:'', q:'', obj:'', seg:'', est:'', estado:'', kpi:'', sort:'id', fav:false}); saveUi(); rerender(); return; }
  if(act === 'import'){ document.getElementById('fileImport').click(); return; }
  if(act === 'propose'){ S.proposal = propose(); rerender(); return; }
  if(act === 'dropprop'){ S.proposal = null; rerender(); return; }
  if(act === 'applyprop'){ (S.proposal || []).forEach(x => savePlan(x.id, {fecha:x.fecha, etapa: etapaOf(x.id) === 'Idea' ? 'Brief listo' : etapaOf(x.id)})); toast(`Fechas asignadas a ${S.proposal.length} piezas`); S.proposal = null; rerender(); return; }
  if(act === 'pushlocal'){ const ids = S.localOnly || []; ids.forEach(id => savePlan(id, {})); S.localOnly = []; toast(`${ids.length} entradas enviadas al plan compartido`); rerender(); return; }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && !document.getElementById('drawer').hidden){ closeSheet(); return; }
  if((e.key === 'Enter' || e.key === ' ') && e.target.dataset && e.target.dataset.open){ e.preventDefault(); location.hash = e.target.dataset.open; }
});
document.getElementById('drawer').addEventListener('click', e => { if(e.target.id === 'drawer') closeSheet(); });
document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.plan){ savePlan(t.dataset.plan, {[t.dataset.field]: t.value}); if(t.dataset.field !== 'notas') rerender(); return; }
  if(t.tagName === 'SELECT' && t.dataset.set){ S.ui[t.dataset.set] = t.value; saveUi(); rerender(); return; }
  if(t.id === 'fileAnchor' && t.files[0] && attachTarget){ attachFile(attachTarget, t.files[0]); t.value = ''; return; }
  if(t.id === 'fileImport' && t.files[0]){ importar(t.files[0]); t.value = ''; }
});
let qT; document.addEventListener('input', e => { if(e.target.id === 'q'){ clearTimeout(qT); const v = e.target.value; qT = setTimeout(() => { S.ui.q = v; saveUi(); const pos = e.target.selectionStart; rerender(); const q = document.getElementById('q'); if(q){ q.focus(); q.setSelectionRange(pos, pos); } }, 220); } });
window.addEventListener('hashchange', route);

renderSync(); route();
loadLocalAnchors().then(() => { if(Object.keys(S.localAnch).length) rerender(); });
initCaps();
})();
</script>
